<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Fantasy F1 on F1 Elo</title>
  <desc id="description">Predict races, trade driver form, and climb the live leaderboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15151f"/>
      <stop offset="1" stop-color="#08080d"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e10600"/>
      <stop offset="1" stop-color="#ff493f"/>
    </linearGradient>
    <radialGradient id="glow" cx="24%" cy="42%" r="66%">
      <stop offset="0" stop-color="#e10600" stop-opacity=".2"/>
      <stop offset="1" stop-color="#e10600" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <path d="M0 5h1200" stroke="url(#red)" stroke-width="10"/>

  <g transform="translate(72 84)" font-family="system-ui, -apple-system, sans-serif">
