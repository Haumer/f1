    <rect width="448" height="480" rx="22" fill="#111119" stroke="#fff" stroke-opacity=".12"/>
    <path d="M0 54h448M0 142h448M18 242h412M18 332h412M0 414h448" stroke="#fff" stroke-opacity=".07"/>
    <text x="22" y="33" fill="#00d26a" font-size="13" font-weight="700" letter-spacing="1.5">● LIVE STANDINGS</text>
