        <rect width="150" height="48" rx="9" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".1"/>
        <text x="75" y="30" text-anchor="middle" fill="#f0c850">PREDICT</text>
      </g>
      <g transform="translate(164)">
        <rect width="150" height="48" rx="9" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".1"/>
        <text x="75" y="30" text-anchor="middle" fill="#00d26a">TRADE</text>
      </g>
      <g transform="translate(328)">
        <rect width="150" height="48" rx="9" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".1"/>
        <text x="75" y="30" text-anchor="middle" fill="#ff493f">CLIMB</text>
      </g>
    </g>

