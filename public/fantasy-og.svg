      <text x="59" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">R</text>
      <text x="91" y="25" fill="#e8e8ed" font-size="17" font-weight="700">racecraft</text>
      <rect x="91" y="38" width="200" height="4" rx="2" fill="#fff" fill-opacity=".06"/>
      <rect x="91" y="38" width="200" height="4" rx="2" fill="#e64848"/>
      <text x="404" y="29" text-anchor="end" fill="#00d26a" font-size="17" font-weight="800">+816</text>
    </g>
    <g transform="translate(22 255)">
      <text x="0" y="30" fill="#a0a0b0" font-size="15" font-weight="800">P2</text>
      <rect x="42" y="7" width="34" height="34" rx="8" fill="#3498db" fill-opacity=".25" stroke="#3498db" stroke-opacity=".7"/>
      <text x="59" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">A</text>
      <text x="91" y="25" fill="#e8e8ed" font-size="17" font-weight="700">apex</text>
      <rect x="91" y="38" width="200" height="4" rx="2" fill="#fff" fill-opacity=".06"/>
      <rect x="91" y="38" width="184" height="4" rx="2" fill="#3498db"/>
      <text x="404" y="29" text-anchor="end" fill="#00d26a" font-size="17" font-weight="800">+752</text>
    </g>
    <g transform="translate(22 345)">
      <text x="0" y="30" fill="#d4844a" font-size="15" font-weight="800">P3</text>
      <rect x="42" y="7" width="34" height="34" rx="8" fill="#f39c12" fill-opacity=".25" stroke="#f39c12" stroke-opacity=".7"/>
      <text x="59" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">Y</text>
      <text x="91" y="25" fill="#e8e8ed" font-size="17" font-weight="700">you</text>
      <rect x="91" y="38" width="200" height="4" rx="2" fill="#fff" fill-opacity=".06"/>
      <rect x="91" y="38" width="135" height="4" rx="2" fill="#f39c12"/>
      <text x="404" y="29" text-anchor="end" fill="#00d26a" font-size="17" font-weight="800">+552</text>
    </g>

    <rect y="414" width="448" height="66" rx="0 0 22 22" fill="#e10600" fill-opacity=".06"/>
    <text x="22" y="453" fill="#ff493f" font-size="13" font-weight="800">NEXT · RACE WEEKEND</text>
    <text x="426" y="453" text-anchor="end" fill="#e8e8ed" font-size="15" font-weight="700">PICKS OPEN</text>
