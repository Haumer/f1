      <text x="28" y="13" fill="#8a8a9a" font-size="17" font-weight="700" letter-spacing="2.2">CHAMPIONSHIP LIVE</text>
    </g>
    <text x="0" y="122" fill="#f4f4f6" font-size="70" font-weight="800" letter-spacing="-3">BACK YOUR READ</text>
    <text x="0" y="200" fill="#f4f4f6" font-size="70" font-weight="800" letter-spacing="-3">OF THE <tspan fill="#e10600">GRID.</tspan></text>
    <text x="4" y="250" fill="#a0a0ae" font-size="23">Predict races. Trade driver form. Climb one live table.</text>

    <g transform="translate(0 306)" font-size="15" font-weight="700" letter-spacing="1.3">
