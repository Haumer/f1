<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">F1 Elo</title>
  <desc id="description">Rating every Formula 1 driver since 1950</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12121a"/>
      <stop offset="1" stop-color="#08080d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e10600"/>
      <stop offset="1" stop-color="#ff493f"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="35%" r="55%">
      <stop offset="0" stop-color="#e10600" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e10600" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="5" fill="url(#accent)"/>

  <g fill="none" stroke="#ffffff" stroke-opacity="0.06">
    <path d="M720 118 L1130 118"/>
    <path d="M720 178 L1130 178"/>
    <path d="M720 238 L1130 238"/>
    <path d="M720 298 L1130 298"/>
    <path d="M720 358 L1130 358"/>
  </g>
  <polyline points="720,330 790,280 850,305 920,205 985,235 1050,145 1130,175"
            fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#e8e8ed">
    <circle cx="720" cy="330" r="7"/>
    <circle cx="790" cy="280" r="7"/>
    <circle cx="850" cy="305" r="7"/>
    <circle cx="920" cy="205" r="7"/>
    <circle cx="985" cy="235" r="7"/>
    <circle cx="1050" cy="145" r="7"/>
    <circle cx="1130" cy="175" r="7"/>
  </g>

  <text x="76" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="112" font-weight="800" letter-spacing="-4">
    <tspan fill="#f5f5f7">F1</tspan><tspan fill="#e10600"> ELO</tspan>
  </text>
  <text x="82" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="650" fill="#a0a0af" letter-spacing="2">
    RATING EVERY FORMULA 1 DRIVER
  </text>
  <text x="82" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#6f6f80">
    One continuous rating from 1950 to today.
  </text>

  <g transform="translate(80 405)" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="650" letter-spacing="1">
    <g>
      <rect width="245" height="56" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.11"/>
      <text x="122.5" y="35" text-anchor="middle" fill="#d9d9df">CROSS-ERA ELO</text>
    </g>
    <g transform="translate(265)">
      <rect width="245" height="56" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.11"/>
      <text x="122.5" y="35" text-anchor="middle" fill="#d9d9df">RACE HISTORY</text>
    </g>
    <g transform="translate(530)">
      <rect width="245" height="56" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.11"/>
      <text x="122.5" y="35" text-anchor="middle" fill="#d9d9df">FREE FANTASY</text>
    </g>
  </g>

  <text x="82" y="556" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="650" fill="#e8e8ed" letter-spacing="1.5">F1ELO.COM</text>
  <text x="1118" y="556" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#666678" letter-spacing="1">OPEN SOURCE</text>
  <rect y="625" width="1200" height="5" fill="url(#accent)"/>
</svg>
